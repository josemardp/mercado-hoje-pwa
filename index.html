<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- S6-07 (AUD-020): GitHub Pages serves static files with no custom
         HTTP headers, so this <meta> is the only CSP delivery mechanism
         available — it can't cover frame-ancestors (meta-delivered CSP
         ignores that directive per spec) or nosniff/X-Frame-Options
         (header-only, no meta equivalent at all). Documented as a hosting
         limitation, see D-0XX in STATUS_EVOLUCAO.md. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF3E6" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Meu Diário: compras, rotina e agenda do seu dia a dia num só app, offline-first e sincronizado entre aparelhos." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meu Diário" />
    <meta property="og:description" content="Compras, rotina e agenda do seu dia a dia num só app, offline-first e sincronizado entre aparelhos." />
    <meta property="og:image" content="/mercado-hoje-pwa/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Meu Diário" />
    <meta name="twitter:description" content="Compras, rotina e agenda do seu dia a dia num só app, offline-first e sincronizado entre aparelhos." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meu Diário" />
    <!-- ITEM 9: Apple touch icon with solid background -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <title>Meu Diário</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
